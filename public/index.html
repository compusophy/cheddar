<body>
<div class="app">
<header>
  <b class="brand" aria-label="say cheese">say<em>cheese</em></b>
  <p id="pot" class="pot"></p>
  <button id="me" type="button">sign in</button>
</header>
<main>
  <section class="hero">
    <h1 id="pitch">make the ai say “cheese”</h1>
    <p id="mood" class="mood hidden"></p>
  </section>
  <div id="thread" aria-live="polite"></div>
</main>
<div class="dock">
  <p id="said" class="said" role="status" aria-live="polite"></p>
  <form id="form" autocomplete="off">
    <input id="msg" placeholder="say something" maxlength="1000" aria-label="your message">
    <button id="send">send</button>
  </form>
  <p id="price" class="dim"></p>
  <p id="allow" class="dim hidden"><span id="allowtext"></span><span id="stopper"><button id="stop" type="button" class="link">stop</button></span></p>
</div>
<footer>
  <details>
    <summary>how it works</summary>
    <ul id="how"></ul>
    <p class="more"><a href="/classic.html">its rules and every past win</a><span id="outer" class="hidden"><button id="out" type="button" class="link">sign out</button></span></p>
  </details>
</footer>
</div>
