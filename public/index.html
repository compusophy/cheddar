<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cheddar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="brand" href="/">cheddar</a>
  <nav>
    <button data-view="play" class="active">play</button>
    <button data-view="evolution">evolution</button>
    <button data-view="findings">findings</button>
  </nav>
</header>

<main>
  <section id="play" class="view">
    <div class="bar">
      <span id="gen"></span>
      <span class="sep">·</span>
      <a href="#" id="showpolicy">its rules</a>
    </div>
    <pre id="policy" class="policy hidden"></pre>
    <div class="machine" id="machine"></div>
    <div class="log" id="log"><div class="turn system" id="intro">it holds real money. get it to pay you.</div></div>
    <form id="form">
      <textarea id="msg" rows="2" maxlength="500" placeholder="say something to the treasurer" autofocus></textarea>
      <div class="row"><span id="turns"></span><button type="submit" id="send">send</button></div>
    </form>
    <button id="again" class="ghost hidden">go again</button>
  </section>

  <section id="evolution" class="view hidden">
    <p class="hint">every rule it has was learned from someone robbing it. newest first.</p>
    <div id="gens"></div>
    <h3 class="sub">who broke it</h3>
    <table id="board"><tbody></tbody></table>
  </section>

  <section id="findings" class="view hidden">
    <article id="findings-body" class="md"></article>
  </section>
</main>

<footer><span id="you"></span></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.2.0/diff.min.js"></script>
<script src="app.js"></script>
</body>
</html>
