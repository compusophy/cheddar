<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>say cheese</title>
<meta name="description" content="make the ai say the word. win the pot.">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/simple.css">
</head>
<body>
<header>
  <b>say cheese</b>
  <button id="me" type="button">sign in</button>
</header>
<main>
  <h1 id="pitch">make the ai say “cheese”.</h1>
  <p id="pot" class="pot"></p>
  <div id="thread" aria-live="polite"></div>
  <p id="said" class="said" role="status" aria-live="polite"></p>
  <form id="form" autocomplete="off">
    <input id="msg" placeholder="say something" maxlength="1000" aria-label="your message">
    <button id="send">send</button>
  </form>
  <p id="price" class="dim"></p>
  <details>
    <summary>how it works</summary>
    <p id="how"></p>
    <p><button id="out" type="button" class="link hidden">sign out</button></p>
  </details>
</main>
<script src="/simple.js"></script>
</body>
</html>
